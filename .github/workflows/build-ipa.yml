name: Build iOS IPA (no code signing)

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

env:
  SCHEME_NAME: TenHundredGames
  APP_NAME: TenHundredGamesApp
  IOS_DIR: ios

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: swift package resolve
        working-directory: ${{ env.IOS_DIR }}

      - name: Build iOS library (verify compilation)
        run: |
          xcodebuild -scheme ${SCHEME_NAME} \
            -destination 'platform=iOS Simulator' \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        working-directory: ${{ env.IOS_DIR }}

      - name: Package unsigned .ipa artifact
        id: package_ipa
        working-directory: ${{ env.IOS_DIR }}
        run: |
          # 構建產出目錄（xcodebuild -derivedDataPath ./build 的標準路徑）
          BUILD_PRODUCTS="./build/Build/Products/Release-iphonesimulator"
          echo "Build products: ${BUILD_PRODUCTS}"

          if [ ! -d "${BUILD_PRODUCTS}" ]; then
            echo "IPA_NOT_FOUND=1" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 建立 IPA 結構：Payload/ 目錄下放構建產物
          rm -rf ./build/export
          mkdir -p ./build/export/Payload

          # 將構建產物複製到 Payload（構成一個未簽名的 .ipa 結構）
          cp -R "${BUILD_PRODUCTS}"/* ./build/export/Payload/ 2>/dev/null || true

          # 創建 Info.plist 讓 .ipa 結構更完整（使用 printf 避免 YAML/XML 標籤衝突）
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleName</key>\n    <string>TenHundredGamesApp</string>\n    <key>CFBundleDisplayName</key>\n    <string>100 Games Plan</string>\n    <key>CFBundleIdentifier</key>\n    <string>com.playbox.tenhundredgames</string>\n    <key>CFBundleVersion</key>\n    <string>1</string>\n    <key>CFBundleShortVersionString</key>\n    <string>1.0.0</string>\n    <key>CFBundleExecutable</key>\n    <string>TenHundredGamesApp</string>\n    <key>LSRequiresIPhoneOS</key>\n    <true/>\n</dict>\n</plist>\n' > ./build/export/Payload/Info.plist

          cd ./build/export
          zip -r "${APP_NAME}.ipa" Payload
          cd ../..

          echo "IPA_PATH=./build/export/${APP_NAME}.ipa" >> $GITHUB_OUTPUT
          echo "ipa packaged successfully"

      - name: Upload unsigned IPA to GitHub Release
        if: steps.package_ipa.outputs.IPA_NOT_FOUND != '1' && github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.IOS_DIR }}/build/export/${APP_NAME}.ipa

      - name: Upload unsigned IPA as Artifact
        if: steps.package_ipa.outputs.IPA_NOT_FOUND != '1'
        uses: actions/upload-artifact@v4
        with:
          name: TenHundredGamesApp-unsigned-ipa
          path: ${{ env.IOS_DIR }}/build/export/${APP_NAME}.ipa
          retention-days: 30

      - name: Upload build products (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: ${{ env.IOS_DIR }}/build/
          retention-days: 30
